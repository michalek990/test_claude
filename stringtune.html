<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>StringTune© — The Way of the Blade</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#c0392b;--red2:#e74c3c;--cyan:#4fc3f7;--dark:#080808;--cream:#f5e6d0}
html{scroll-behavior:auto}
body{background:var(--dark);color:#fff;font-family:'Georgia','Times New Roman',serif;overflow-x:hidden;cursor:none}
#cursor{position:fixed;pointer-events:none;z-index:9999;width:10px;height:10px;background:var(--red);border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen}
#cursor-ring{position:fixed;pointer-events:none;z-index:9998;width:32px;height:32px;border:1px solid rgba(192,57,43,0.5);border-radius:50%;transform:translate(-50%,-50%);transition:left .12s ease,top .12s ease,transform .2s ease}
#progress-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--red),var(--red2));transform-origin:left;transform:scaleX(0)}
#left-bars{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:100;display:flex;gap:5px;align-items:flex-end;opacity:.7}
.bar{width:4px;border-radius:2px;background:var(--cyan);animation:bar-pulse 1.2s ease-in-out infinite alternate}
.bar:nth-child(1){height:28px;animation-delay:0s}.bar:nth-child(2){height:44px;animation-delay:.15s}.bar:nth-child(3){height:20px;animation-delay:.3s}
@keyframes bar-pulse{from{opacity:.3;transform:scaleY(.6)}to{opacity:1;transform:scaleY(1)}}
#navbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:150;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(8,8,8,.65);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.04)}
.nav-logo{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.02em;color:#eee;font-family:system-ui,sans-serif}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#c0392b,#922b21);display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-right{display:flex;align-items:center;gap:16px}
.skill-hub-btn{display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#ccc;font-size:12px;font-family:system-ui,sans-serif;cursor:pointer;letter-spacing:.05em;transition:all .2s}
.skill-hub-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.skill-icon{width:24px;height:24px;background:radial-gradient(circle,#aaa 30%,transparent 70%);border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.nav-dots{display:flex;gap:4px}.nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
#scroll-root{height:600vh;position:relative}
#scene{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
#dark-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 60%,#0d0d0d 0%,#020202 100%)}
#painting{position:absolute;inset:0;opacity:0;overflow:hidden}
.paint-sky{position:absolute;inset:0;background:linear-gradient(180deg,#0a0f1a 0%,#1a1f2e 15%,#2d1f3d 30%,#1a0a0a 50%,#0d0505 100%)}
.paint-mtn-back{position:absolute;bottom:0;left:0;right:0;height:75%;background:radial-gradient(ellipse 120% 80% at 20% 100%,#7b1d1d 0%,transparent 60%),radial-gradient(ellipse 100% 70% at 80% 100%,#922b21 0%,transparent 55%),radial-gradient(ellipse 80% 90% at 50% 100%,#6b1414 0%,transparent 70%),radial-gradient(ellipse 60% 60% at 35% 100%,#a93226 0%,transparent 50%)}
.paint-mtn-front{position:absolute;bottom:0;left:0;right:0;height:55%;background:radial-gradient(ellipse 90% 80% at 15% 100%,#8b1a1a 0%,transparent 55%),radial-gradient(ellipse 70% 70% at 60% 100%,#c0392b 0%,transparent 50%),radial-gradient(ellipse 50% 60% at 90% 100%,#922b21 0%,transparent 55%)}
.paint-clouds{position:absolute;top:20%;left:0;right:0;height:55%;background:radial-gradient(ellipse 180px 60px at 10% 30%,rgba(220,210,195,.85) 0%,transparent 70%),radial-gradient(ellipse 220px 50px at 25% 20%,rgba(200,195,185,.7) 0%,transparent 70%),radial-gradient(ellipse 160px 55px at 45% 35%,rgba(215,205,190,.75) 0%,transparent 70%),radial-gradient(ellipse 200px 45px at 65% 25%,rgba(225,215,200,.8) 0%,transparent 65%),radial-gradient(ellipse 140px 50px at 80% 30%,rgba(210,200,188,.7) 0%,transparent 70%),radial-gradient(ellipse 250px 70px at 30% 55%,rgba(190,180,165,.6) 0%,transparent 70%),radial-gradient(ellipse 200px 65px at 70% 60%,rgba(195,185,170,.55) 0%,transparent 70%)}
.paint-ground{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent 0%,rgba(5,3,3,.6) 30%,rgba(3,2,2,.95) 70%,#020202 100%)}
.paint-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.6) 100%)}
#katana-wrapper{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);height:60px;display:flex;align-items:center}
#katana{position:absolute;height:50px;width:680px;right:-700px;display:flex;align-items:center;filter:drop-shadow(0 0 8px rgba(79,195,247,.6)) drop-shadow(0 0 20px rgba(79,195,247,.2))}
.katana-handle{width:120px;height:14px;border-radius:4px;background:linear-gradient(90deg,#1a1a1a 0%,#2d2d2d 20%,#1a1a1a 40%,#333 60%,#1a1a1a 80%,#222 100%);position:relative;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.8)}
.katana-handle::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(255,255,255,.06) 6px,rgba(255,255,255,.06) 8px);border-radius:4px}
.katana-tsuba{width:18px;height:34px;flex-shrink:0;background:linear-gradient(180deg,#555 0%,#888 30%,#666 60%,#444 100%);border-radius:50%/30%;box-shadow:2px 0 6px rgba(0,0,0,.8),-1px 0 3px rgba(0,0,0,.5);position:relative}
.katana-tsuba::after{content:'';position:absolute;inset:4px 2px;border-radius:50%/30%;border:1px solid rgba(255,255,255,.12)}
.katana-blade{flex:1;height:10px;position:relative;background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.04) 20%,rgba(200,220,240,.9) 35%,rgba(220,235,250,.98) 50%,rgba(180,210,235,.85) 65%,rgba(79,195,247,.5) 80%,transparent 100%);clip-path:polygon(0 20%,100% 35%,100% 65%,0 80%);border-radius:0 2px 2px 0}
.katana-blade::before{content:'';position:absolute;top:35%;left:0;right:10%;height:1px;background:linear-gradient(90deg,rgba(200,230,255,.4) 0%,rgba(150,200,240,.8) 30%,rgba(79,195,247,.9) 60%,rgba(150,220,255,.5) 80%,transparent 100%);filter:blur(.5px)}
.katana-blade::after{content:'';position:absolute;right:0;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(79,195,247,.4),rgba(150,220,255,.7));filter:blur(2px)}
.katana-hi{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#c0392b;box-shadow:0 0 8px #c0392b,0 0 16px rgba(192,57,43,.6)}
.scroll-text{position:absolute;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vw,52px);font-weight:300;letter-spacing:.08em;color:rgba(255,255,255,.15);white-space:nowrap;pointer-events:none;user-select:none}
#text-concentrate{top:45%}
#text-keep{top:45%;opacity:0}
#text-awaken{top:45%;opacity:0;font-size:clamp(18px,2.5vw,32px);color:rgba(245,230,208,.12);font-style:italic}
#master{position:absolute;bottom:-200px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0}
#master-portrait{width:90px;height:100px;border-radius:8px;overflow:hidden;border:2px solid rgba(192,57,43,.5);box-shadow:0 0 20px rgba(192,57,43,.3),0 8px 32px rgba(0,0,0,.8)}
.master-face{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;background:linear-gradient(180deg,#c4a882 0%,#b08060 40%,#5a4030 100%)}
.master-head{width:42px;height:48px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 40% 35%,#d4b896 0%,#c4a07a 40%,#a07050 100%);position:relative;margin-bottom:2px}
.master-head::before{content:'· ·';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);font-size:7px;color:#2a1a0a;letter-spacing:5px}
.master-head::after{content:'';position:absolute;bottom:-8px;left:20%;right:20%;height:12px;background:linear-gradient(180deg,rgba(220,215,210,.9),rgba(200,195,188,.5));border-radius:30% 30% 50% 50%}
.master-robe{width:60px;height:30px;background:linear-gradient(180deg,#3a2820 0%,#2a1e14 100%);border-radius:40% 40% 0 0;border-top:2px solid rgba(120,80,40,.5)}
#master-name{font-size:10px;letter-spacing:.3em;color:rgba(245,220,185,.6);text-transform:uppercase;font-family:system-ui,sans-serif}
#dialogue{position:absolute;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);min-width:280px;max-width:420px;opacity:0}
.dialogue-inner{background:rgba(10,10,10,.92);border:1px solid rgba(192,57,43,.3);border-radius:10px;padding:14px 18px;display:flex;align-items:flex-start;gap:10px;backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.dialogue-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#4fc3f7,#0288d1);display:flex;align-items:center;justify-content:center;font-size:14px}
.dialogue-text{font-size:13px;line-height:1.6;color:#ddd;font-family:system-ui,sans-serif;font-style:italic}
.dialogue-cursor{display:inline-block;width:2px;height:14px;background:var(--red);vertical-align:middle;animation:blink-cur .8s ease infinite}
@keyframes blink-cur{0%,100%{opacity:1}50%{opacity:0}}
#skip-btn{position:absolute;bottom:30px;right:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);cursor:pointer;font-family:system-ui,sans-serif;opacity:0;transition:color .2s}
#skip-btn:hover{color:rgba(255,255,255,.6)}
#bonsai{position:absolute;bottom:20px;left:20px;opacity:0;transform:scale(.6)}
.bonsai-svg{width:50px;height:55px;filter:drop-shadow(0 0 6px rgba(192,57,43,.4))}
#sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cyan);opacity:0;animation:spark-fly 1.8s ease-out infinite}
@keyframes spark-fly{0%{opacity:0;transform:translate(0,0) scale(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
#after-scene{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px;background:linear-gradient(180deg,#020202,#0a0505,#020202);text-align:center;gap:40px}
.after-title{font-size:clamp(36px,6vw,72px);font-weight:300;letter-spacing:.12em;color:var(--cream);line-height:1.2}
.after-title span{color:var(--red)}
.after-sub{font-size:15px;color:rgba(245,230,208,.5);letter-spacing:.08em;font-family:system-ui,sans-serif;max-width:480px;line-height:1.7}
.after-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.cta-btn{padding:14px 40px;border-radius:2px;background:transparent;border:1px solid rgba(192,57,43,.5);color:var(--cream);font-size:12px;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:all .3s;font-family:system-ui,sans-serif}
.cta-btn:hover{background:rgba(192,57,43,.15);border-color:var(--red);box-shadow:0 0 20px rgba(192,57,43,.2)}
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="progress-bar"></div>
<div id="left-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>

<nav id="navbar">
  <div class="nav-logo">
    <div class="logo-icon">&#10022;</div>
    StringTune<sup style="font-size:9px;color:rgba(255,255,255,.4)">&#169;</sup>
  </div>
  <div class="nav-right">
    <button class="skill-hub-btn">Skill Hub</button>
    <div class="skill-icon"></div>
    <div class="nav-dots"><div class="nav-dot"></div><div class="nav-dot"></div><div class="nav-dot"></div></div>
  </div>
</nav>

<div id="scroll-root">
  <div id="scene">
    <div id="dark-bg"></div>
    <div id="painting">
      <div class="paint-sky"></div>
      <div class="paint-mtn-back"></div>
      <div class="paint-mtn-front"></div>
      <div class="paint-clouds"></div>
      <div class="paint-ground"></div>
      <div class="paint-vignette"></div>
    </div>
    <div id="sparks"></div>
    <div id="katana-wrapper">
      <div id="katana">
        <div class="katana-handle"></div>
        <div class="katana-tsuba"></div>
        <div class="katana-blade"><div class="katana-hi"></div></div>
      </div>
    </div>
    <div class="scroll-text" id="text-concentrate">Concentrate.</div>
    <div class="scroll-text" id="text-keep">Keep Scrolling.</div>
    <div class="scroll-text" id="text-awaken">The path reveals itself to those who persist.</div>
    <div id="master">
      <div id="master-portrait">
        <div class="master-face">
          <div class="master-head"></div>
          <div class="master-robe"></div>
        </div>
      </div>
      <div id="master-name">Master Aoi</div>
    </div>
    <div id="dialogue">
      <div class="dialogue-inner">
        <div class="dialogue-avatar">&#9791;</div>
        <div class="dialogue-text"><span id="typed-text"></span><span class="dialogue-cursor"></span></div>
      </div>
    </div>
    <div id="bonsai">
      <svg class="bonsai-svg" viewBox="0 0 50 55" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25 50 Q23 40 22 30 Q20 20 25 10" stroke="#8b4513" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M25 50 Q27 42 28 32 Q29 22 25 10" stroke="#6b3410" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M22 28 Q14 22 10 18" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M24 20 Q30 14 36 12" stroke="#8b4513" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M23 34 Q16 30 12 28" stroke="#6b3410" stroke-width="1" stroke-linecap="round" fill="none"/>
        <ellipse cx="10" cy="16" rx="8" ry="6" fill="#922b21" opacity="0.8"/>
        <ellipse cx="8" cy="14" rx="6" ry="5" fill="#c0392b" opacity="0.7"/>
        <ellipse cx="36" cy="11" rx="7" ry="5" fill="#922b21" opacity="0.8"/>
        <ellipse cx="38" cy="9" rx="5" ry="4" fill="#c0392b" opacity="0.7"/>
        <ellipse cx="25" cy="8" rx="9" ry="7" fill="#a93226" opacity="0.85"/>
        <ellipse cx="23" cy="6" rx="7" ry="5" fill="#c0392b" opacity="0.7"/>
        <ellipse cx="12" cy="27" rx="6" ry="4" fill="#7b1d1d" opacity="0.7"/>
        <rect x="18" y="48" width="14" height="6" rx="2" fill="#4a3020"/>
        <rect x="16" y="46" width="18" height="4" rx="1" fill="#5a3828"/>
      </svg>
    </div>
    <div id="skip-btn" onclick="skipToEnd()">Skip &#8594;</div>
  </div>
</div>

<div id="after-scene">
  <div class="after-divider"></div>
  <h1 class="after-title">The Way of<br/><span>StringTune</span></h1>
  <div class="after-divider"></div>
  <p class="after-sub">Master your craft. Every string tells a story. Every note carries the weight of a thousand scrolls. The blade and the string — different paths, same discipline.</p>
  <button class="cta-btn">Begin Your Journey</button>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

// Cursor
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
  ring.style.left = e.clientX + 'px';
  ring.style.top  = e.clientY + 'px';
});
document.querySelectorAll('button,[onclick]').forEach(el => {
  el.addEventListener('mouseenter', () => { ring.style.transform = 'translate(-50%,-50%) scale(1.8)'; });
  el.addEventListener('mouseleave', () => { ring.style.transform = 'translate(-50%,-50%) scale(1)'; });
});

// Sparks
const sparksEl = document.getElementById('sparks');
function createSpark(x, y) {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 55;
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.animationDelay = Math.random() * 0.3 + 's';
    s.style.animationDuration = (0.7 + Math.random() * 1) + 's';
    s.style.background = Math.random() > 0.5 ? '#4fc3f7' : '#c0392b';
    s.style.width = s.style.height = (2 + Math.random() * 3) + 'px';
    sparksEl.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}
setInterval(() => {
  const k = document.getElementById('katana');
  const rect = k.getBoundingClientRect();
  if (rect.right > 50 && rect.right < window.innerWidth + 50) {
    createSpark(rect.right - 25, rect.top + rect.height * 0.5);
  }
}, 700);

// Typing
let typingTO;
function typeText(text, el, speed) {
  clearTimeout(typingTO);
  el.textContent = '';
  let i = 0;
  function next() {
    if (i < text.length) { el.textContent += text[i++]; typingTO = setTimeout(next, speed); }
  }
  next();
}

function skipToEnd() {
  window.scrollTo({ top: document.getElementById('scroll-root').scrollHeight, behavior: 'smooth' });
}

// Main timeline
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: '#scroll-root',
    start: 'top top',
    end: 'bottom bottom',
    scrub: 1.5
  }
});

// Progress bar
ScrollTrigger.create({
  trigger: 'body', start: 'top top', end: 'bottom bottom',
  onUpdate: self => {
    document.getElementById('progress-bar').style.transform = 'scaleX(' + self.progress + ')';
  }
});

// Phase 1: katana enters from right
tl.to('#katana', { right: '50%', duration: 3, ease: 'power2.out' }, 0);

// Concentrate text
tl.to('#text-concentrate', { opacity: 0.18, duration: 1 }, 0.5)
  .to('#text-concentrate', { opacity: 0,    duration: 1 }, 2.5);

// Keep scrolling text
tl.to('#text-keep', { opacity: 0.16, duration: 1 }, 2)
  .to('#text-keep', { opacity: 0,    duration: 1 }, 4);

// Phase 2: painting reveals
tl.to('#painting', { opacity: 1, duration: 3, ease: 'power1.inOut' }, 4);

// Katana drifts left through painting
tl.to('#katana', { right: '85%', duration: 5, ease: 'none' }, 4);
tl.to('#katana-wrapper', { top: '43%', duration: 3 }, 5);
tl.to('#katana', {
  filter: 'drop-shadow(0 0 16px rgba(79,195,247,.9)) drop-shadow(0 0 40px rgba(79,195,247,.4))',
  duration: 2
}, 5);

// Phase 3: katana passes out left
tl.to('#katana', { right: '115%', duration: 4, ease: 'power1.in' }, 9);

// Awaken text
tl.to('#text-awaken', { opacity: 0.18, duration: 1.5 }, 8)
  .to('#text-awaken', { opacity: 0,    duration: 1   }, 11);

// Phase 4: master appears
tl.to('#master',  { opacity: 1, bottom: '55px', duration: 2,   ease: 'power3.out' }, 11);
tl.to('#dialogue',{ opacity: 1, y: 0,           duration: 1.5, ease: 'power2.out',
  onComplete: () => typeText("Ah, you've finally awaked...", document.getElementById('typed-text'), 50)
}, 12.5);
tl.to('#bonsai',  { opacity: 1, scale: 1,       duration: 1.5, ease: 'back.out(1.4)' }, 12);
tl.to('#skip-btn',{ opacity: 1, duration: 1 }, 1);

// Parallax layers
ScrollTrigger.create({
  trigger: '#scroll-root', start: 'top top', end: 'bottom bottom',
  onUpdate: self => {
    const p = self.progress;
    document.querySelector('.paint-clouds').style.transform    = 'translateX(' + (p * -90) + 'px)';
    document.querySelector('.paint-mtn-back').style.transform  = 'translateX(' + (p * -25) + 'px)';
    document.querySelector('.paint-mtn-front').style.transform = 'translateX(' + (p * -45) + 'px)';
  }
});

// Second dialogue
ScrollTrigger.create({
  trigger: '#scroll-root', start: '90% top',
  onEnter: () => {
    setTimeout(() => {
      if (document.getElementById('typed-text').textContent.length > 3) {
        typeText("The blade does not choose its path. Neither does the string.", document.getElementById('typed-text'), 42);
      }
    }, 3200);
  }
});
</script>
</body>
</html>
